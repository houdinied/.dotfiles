# Pin Hyprland/Aquamarine to the Intel iGPU only, so plugging/unplugging the
# RTX 4090 eGPU never touches the compositor (CUDA finds it on its own).
# /dev/dri/intel-igpu is a udev symlink (99-intel-igpu.rules): AQ_DRM_DEVICES
# is colon-separated, so by-path names (pci-0000:00:02.0-card) would be split
# into garbage, and bare card0/card1 reshuffle depending on whether the eGPU
# was present at boot.
env = AQ_DRM_DEVICES,/dev/dri/intel-igpu

# Keep Go caches under XDG paths for apps launched by Hyprland.
env = GOPATH,/home/bdepyzy/.local/share/go
env = GOBIN,/home/bdepyzy/.local/bin
env = GOMODCACHE,/home/bdepyzy/.cache/go/mod
env = GOCACHE,/home/bdepyzy/.cache/go/build
