# Prevent flameshot from causing fullscreen state on the window that regains focus
# btop larger than default floating TUI size
windowrule = size 1006 690, match:class ^org\.omarchy\.btop$

# Chrome/Chromium picture-in-picture windows should behave like draggable overlays
windowrule = float true, match:title ^Picture in picture$
windowrule = pin true, match:title ^Picture in picture$
windowrule = size 600 338, match:title ^Picture in picture$

# windowrule = tag -chromium-based-browser, match:class ^chromium$
windowrule = tile on, match:class ^chromium$
windowrule = suppress_event fullscreen, match:class ^org\.telegram\.desktop$

# Do not let CLI agents raise or reveal their terminal when they finish.
# Omarchy tags Alacritty, Kitty, and Ghostty windows as "terminal".
windowrule = focus_on_activate off, match:tag terminal


# Workspace assignments — mirrors startup layout
# windowrule = workspace 1 silent, match:class ^chromium$
windowrule = workspace 3 silent, match:class ^obsidian$
windowrule = workspace 4 silent, match:class ^org\.telegram\.desktop$
windowrule = workspace 4 silent, match:class ^discord$
windowrule = workspace 5 silent, match:class ^chrome-chat\.deepseek\.com.*$
windowrule = workspace 5 silent, match:class ^chrome-chatgpt\.com.*$
windowrule = workspace 5 silent, match:class ^chrome-claude\.ai.*$
windowrule = workspace 5 silent, match:class ^chrome-www\.kimi\.com.*$
## Omasnap screenshot and annotation overlay
layerrule = no_anim on, match:namespace ^omasnap$
