# i3-style overrides

# Close window: Super+Q (was Super+W)
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive,

# Relocate displaced defaults
unbind = SUPER, SPACE
unbind = SUPER SHIFT, SPACE
unbind = SUPER, D
bindd = SUPER, D, Launch apps, exec, omarchy-launch-walker -m menus:apps
bindd = SUPER, W, Group all windows into tabs, exec, ~/.config/hypr/scripts/group-all.sh
bindd = SUPER, U, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, E, Ungroup all windows, exec, ~/.config/hypr/scripts/ungroup-all.sh
bindd = SUPER, Y, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle

# vim-style focus (replaces Super+J/K/L)
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
bindd = SUPER, H, Move focus left, movefocus, l
bindd = SUPER, J, Move focus down, movefocus, d
bindd = SUPER, K, Move focus up, movefocus, u
bindd = SUPER, L, Move focus right, movefocus, r

# vim-style: reorders within group if grouped, otherwise moves window
bindd = SUPER SHIFT, H, Move window left, exec, ~/.config/hypr/scripts/move-window.sh l
bindd = SUPER SHIFT, J, Move window down, exec, ~/.config/hypr/scripts/move-window.sh d
bindd = SUPER SHIFT, K, Move window up, exec, ~/.config/hypr/scripts/move-window.sh u
bindd = SUPER SHIFT, L, Move window right, exec, ~/.config/hypr/scripts/move-window.sh r

# Screenshot
bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-cmd-screenshot

# Keyboard backlight
bindd = , F11, Keyboard backlight off, exec, brightnessctl -d tpacpi::kbd_backlight set 0
bindd = , F12, Keyboard backlight on, exec, brightnessctl -d tpacpi::kbd_backlight set 2

# Volume keys fallback when the function row sends plain F-keys instead of XF86Audio keys
bindeld = , F2, Volume down, exec, swayosd-client --monitor "$(omarchy-hyprland-monitor-focused)" --output-volume lower
bindeld = , F3, Volume up, exec, swayosd-client --monitor "$(omarchy-hyprland-monitor-focused)" --output-volume raise

# Monitor scaling (overrides omarchy default)
unbind = SUPER, Slash
bindd = SUPER, Slash, Cycle monitor scaling, exec, ~/.config/hypr/scripts/monitor-scale-cycle.sh

# Clipboard
unbind = SUPER, V
bindd = SUPER, V, Universal paste, exec, ~/.config/hypr/scripts/paste.sh

# Fullscreen/browser overrides
unbind = SUPER, F
unbind = SUPER ALT, RETURN

# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Full screen, fullscreen, 0
bindd = SUPER, F, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, T, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
unbind = SUPER SHIFT, E
unbind = SUPER CTRL ALT SHIFT, E
bindd = SUPER ALT, I, Logout, exec, omarchy-system-logout
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Move window to workspace and follow it
unbind = SUPER SHIFT ALT, code:10
unbind = SUPER SHIFT ALT, code:11
unbind = SUPER SHIFT ALT, code:12
unbind = SUPER SHIFT ALT, code:13
unbind = SUPER SHIFT ALT, code:14
unbind = SUPER SHIFT ALT, code:15
unbind = SUPER SHIFT ALT, code:16
unbind = SUPER SHIFT ALT, code:17
unbind = SUPER SHIFT ALT, code:18
unbind = SUPER SHIFT ALT, code:19
bindd = SUPER SHIFT ALT, code:10, Move window to workspace 1, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 1 --follow
bindd = SUPER SHIFT ALT, code:11, Move window to workspace 2, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 2 --follow
bindd = SUPER SHIFT ALT, code:12, Move window to workspace 3, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 3 --follow
bindd = SUPER SHIFT ALT, code:13, Move window to workspace 4, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 4 --follow
bindd = SUPER SHIFT ALT, code:14, Move window to workspace 5, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 5 --follow
bindd = SUPER SHIFT ALT, code:15, Move window to workspace 6, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 6 --follow
bindd = SUPER SHIFT ALT, code:16, Move window to workspace 7, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 7 --follow
bindd = SUPER SHIFT ALT, code:17, Move window to workspace 8, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 8 --follow
bindd = SUPER SHIFT ALT, code:18, Move window to workspace 9, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 9 --follow
bindd = SUPER SHIFT ALT, code:19, Move window to workspace 10, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 10 --follow

# Move window to workspace silently (stay on current workspace)
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
bindd = SUPER SHIFT, code:10, Move window silently to workspace 1, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 1
bindd = SUPER SHIFT, code:11, Move window silently to workspace 2, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 2
bindd = SUPER SHIFT, code:12, Move window silently to workspace 3, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 3
bindd = SUPER SHIFT, code:13, Move window silently to workspace 4, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 4
bindd = SUPER SHIFT, code:14, Move window silently to workspace 5, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 5
bindd = SUPER SHIFT, code:15, Move window silently to workspace 6, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 6
bindd = SUPER SHIFT, code:16, Move window silently to workspace 7, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 7
bindd = SUPER SHIFT, code:17, Move window silently to workspace 8, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 8
bindd = SUPER SHIFT, code:18, Move window silently to workspace 9, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 9
bindd = SUPER SHIFT, code:19, Move window silently to workspace 10, exec, ~/.config/hypr/scripts/move-active-to-workspace.sh 10

# Power profile cycle
unbind = SUPER, P
bindd = SUPER, P, Cycle power profile, exec, ~/.config/hypr/scripts/power-profile-cycle.sh

# Resize submap (i3-style: Super+R to enter, arrow keys or hjkl to resize, Escape to exit)
bindd = SUPER, R, Enter resize mode, submap, resize
submap = resize
binde = , right, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
binde = , l, resizeactive, 40 0
binde = , h, resizeactive, -40 0
binde = , k, resizeactive, 0 -40
binde = , j, resizeactive, 0 40
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server
# Pomodoro keybind template. Pick a key, uncomment, and reload Hyprland.
# bindd = SUPER ALT, P, Start Pomodoro, exec, ~/.config/waybar/scripts/pomodoro.sh init
bindd = SUPER SHIFT, W, Toggle Pomodoro visibility, exec, ~/.config/waybar/scripts/pomodoro.sh toggle-visible

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-cmd-screenshot          # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
bindd = SUPER, PERIOD, Emoji picker, exec, omarchy-launch-walker -m symbols
